<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>교정 책상 — 성경사전 인용 대조</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#E6E9EC;      /* 교정지 */
  --paper-lit:#F2F4F6;
  --ink:#1E2A33;        /* 본문 잉크 */
  --ink-soft:#5A6873;
  --rule:#C3CAD1;
  --red:#A8323C;        /* 고칠 것 */
  --blue:#2E5E8C;       /* 물음 */
  --ochre:#8A7A3E;      /* 원문대로 */
  --green:#3F6B4A;      /* 마친 것 */
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:"Noto Serif KR",'Nanum Myeongjo',Batang,serif;
  font-weight:300; font-size:14.5px; line-height:1.6;
  display:flex; flex-direction:column;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}

/* ── 머리 ── */
header{
  display:flex;align-items:baseline;gap:1rem;
  padding:.5rem 1rem .45rem;border-bottom:1px solid var(--ink);
  background:var(--paper-lit);flex:none;flex-wrap:wrap;
}
h1{margin:0;font-size:1.15rem;font-weight:600;letter-spacing:.06em}
.sub{color:var(--ink-soft);font-size:.82rem}
header .sp{flex:1}
.btn{
  border:1px solid var(--ink);background:transparent;color:var(--ink);
  padding:.28rem .8rem;border-radius:0;font-size:.85rem;
}
.btn:hover{background:var(--ink);color:var(--paper-lit)}
.btn:disabled{opacity:.35;cursor:default}
.btn:disabled:hover{background:transparent;color:var(--ink)}
.btn.red{border-color:var(--red);color:var(--red)}
.btn.red:hover{background:var(--red);color:var(--paper-lit)}

/* ── 큰 틀 ── */
main{flex:1;display:flex;min-height:0}
#rail{
  width:206px;flex:none;border-right:1px solid var(--rule);
  overflow-y:auto;background:var(--paper-lit);
}
#listwrap{width:262px;flex:none;border-right:1px solid var(--rule);overflow-y:auto}
#detail{flex:1;display:flex;min-width:0;overflow:hidden}
#cmpcol{
  width:330px;flex:none;border-right:1px solid var(--rule);
  overflow-y:auto;padding:.7rem .8rem 2rem;background:var(--paper-lit);
}
#textcol{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}
#textcol>.entryhead{flex:none;margin:0;padding:.55rem 1.1rem .3rem}
/* 영문과 한글을 좌우로 나란히 — 각자 따로 굴린다 */
#twocol{flex:1;display:flex;min-height:0}
#twocol>.pane{
  flex:1;min-width:0;margin:0;max-width:none;
  display:flex;flex-direction:column;overflow:hidden;
  padding:0 1.1rem 1rem;
}
#twocol>.pane+.pane{border-left:1px solid var(--rule)}
#twocol .lab{flex:none;margin-bottom:.3rem;position:sticky;top:0;background:var(--paper);padding-top:.35rem}
#twocol .scroll{flex:1;overflow-y:auto;padding-bottom:1.5rem}
#twocol .acts{flex:none;padding-top:.5rem;border-top:1px solid var(--rule);margin-top:0}
#twocol textarea{min-height:0;flex:1}
/* 참조 구절 — 한글 칸 아래 */
.refbox{
  margin-top:.5rem;padding-top:.5rem;
  border-top:1px dashed var(--blue);
}
/* 참조가 들어간 뒤에는 초록 잉크로 — 손댄 자리를 알아보게 */
.refbox.filled{border-top-color:var(--green)}
.refbox.filled .reflab{color:var(--green)}
.refbox.filled input{border-color:var(--green);background:rgba(63,107,74,.07)}
.refbox.filled .refhint{color:var(--green)}
/* 본문에 붙은 참조 구절 */
.refmark{color:var(--green);font-weight:400}
.refmark .cit{border-bottom-color:var(--green);color:var(--green)}
/* 고친 항목 표시 */
.entryhead.touched{border-bottom-color:var(--green)}
.tag-touched{
  color:var(--green);border:1px solid var(--green);
  font-size:.7rem;padding:0 .35em;margin-left:.4rem;letter-spacing:.04em;
}
.row.touched .rterm::before{content:"✎ ";color:var(--green)}
.pane .lab .edited{color:var(--green)}
.reflab{font-size:.72rem;color:var(--ink-soft);margin-bottom:.3rem}
.refbox input{
  width:100%;padding:.35rem .5rem;border:1px solid var(--blue);
  background:var(--paper-lit);font-size:.88rem;
}
.refbox input:focus{outline:2px solid var(--blue);outline-offset:-1px}
.refacts{display:flex;gap:.4rem;margin-top:.4rem;flex-wrap:wrap}
.refhint{font-size:.76rem;color:var(--blue);margin-top:.35rem;line-height:1.45}
/* 성구 대조표 — 한글을 기준으로 영문의 짝을 나란히 */
.cmp{width:100%;border-collapse:collapse;margin:0;font-size:.83rem;line-height:1.35}
.cmp caption{
  text-align:left;font-size:.72rem;color:var(--ink-soft);line-height:1.5;
  border-bottom:1px solid var(--ink);padding-bottom:.25rem;margin-bottom:.3rem;
}
.cmp th{
  text-align:left;font-weight:400;font-size:.7rem;color:var(--ink-soft);
  padding:.1rem .35rem .2rem 0;border-bottom:1px solid var(--rule);
  position:sticky;top:0;background:var(--paper-lit);
}
.cmp td{padding:.16rem .35rem .16rem .25rem;border-bottom:1px solid rgba(195,202,209,.5);
  font-variant-numeric:tabular-nums;vertical-align:top;word-break:keep-all}
.cmp tr{cursor:pointer}
.cmp tr:hover td{background:var(--paper-lit)}
.cmp tr.bad td,.cmp tr.miss td{color:var(--red)}
.cmp tr.bad td:first-child,.cmp tr.miss td:first-child{box-shadow:inset 3px 0 0 var(--red)}
.cmp tr.miss .mk,.cmp tr.bad .mk{color:var(--red)}
.cmp tr.only td{color:var(--ink-soft);opacity:.75}
.cmp tr.only .mk{color:var(--blue)}
.cmp tr.only td{color:var(--ink-soft)}
.cmp tr.on td{background:var(--paper-lit);font-weight:600}
.cmp .mk{text-align:center;width:1.7rem;padding-right:0}
.cmp tr.ok .mk{color:var(--green)}
.cmp tr.bad .mk{color:var(--red)}
.cmp tr.only .mk{color:var(--ink-soft)}
.cmp .none{color:var(--ink-soft)}
.cit.pick{background:rgba(46,94,140,.16);border-bottom-color:var(--blue)}

/* ── 왼쪽 소견 ── */
.railsec{padding:.6rem .8rem;border-bottom:1px solid var(--rule)}
.railsec h2{margin:0 0 .35rem;font-size:.78rem;font-weight:600;color:var(--ink-soft);letter-spacing:.1em}
.kind{
  display:flex;justify-content:space-between;align-items:baseline;gap:.5rem;
  padding:.16rem 0;cursor:pointer;border:none;background:none;width:100%;text-align:left;
}
.kind:hover .kn{text-decoration:underline}
.kind[aria-current="true"] .kn{font-weight:600}
.kind[aria-current="true"]{background:rgba(30,42,51,.06);margin:0 -.5rem;padding-left:.5rem;padding-right:.5rem}
.kn{font-size:.9rem}
.kc{font-variant-numeric:tabular-nums;font-size:.86rem;color:var(--ink-soft)}
.kind.k-red .kc{color:var(--red);font-weight:600}
.kind.k-blue .kc{color:var(--blue)}
.kind.k-ok .kc{color:var(--green)}
.kind.quiet .kn{color:var(--ink-soft)}
.kind.quiet .kn::after{content:' ·';opacity:.6}

/* ── 가운데 목록 ── */
.row{
  display:block;width:100%;text-align:left;border:none;background:none;
  padding:.36rem .7rem;border-bottom:1px solid var(--rule);
}
.row:hover{background:var(--paper-lit)}
.row[aria-current="true"]{background:var(--paper-lit);box-shadow:inset 3px 0 0 var(--blue)}
.row .rid{font-size:.74rem;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.row .rterm{font-size:.93rem}
.row .rnote{font-size:.78rem;color:var(--ink-soft);margin-top:.1rem}
/* 목록 줄에도 잉크 색을 실어 급한 것이 바로 보이게 */
.row{border-left:4px solid transparent}
.row.t-red{border-left-color:var(--red)}
.row.t-red .rterm{color:var(--red)}
.row.t-red .rnote{color:var(--red);opacity:.85}
.row.t-blue{border-left-color:var(--blue)}
.row.t-note{border-left-color:var(--ochre)}
.row.t-note .rnote{color:var(--ochre)}
.row .rbadge{
  float:right;font-size:.68rem;letter-spacing:.06em;
  border:1px solid currentColor;padding:0 .35em;line-height:1.5;
}
.row.t-red .rbadge{color:var(--red)}
.row.t-blue .rbadge{color:var(--blue)}
.row.t-note .rbadge{color:var(--ochre)}
.row.done{border-left-color:var(--green)!important;opacity:.55}
.row.done .rterm,.row.done .rnote{color:var(--green)}
.row.done .rbadge{display:none}
.row.done .rterm{color:var(--green)}
.row.done .rterm::after{content:" ✓";color:var(--green)}

/* ── 오른쪽 상세 ── */
.entryhead{border-bottom:1px solid var(--ink);padding-bottom:.35rem;margin-bottom:.7rem}
.entryhead .t{font-size:1.22rem;font-weight:600;margin:0}
.entryhead .m{font-size:.8rem;color:var(--ink-soft);margin-top:.15rem}
.pane{margin-bottom:.95rem;max-width:78ch}
.pane .lab{
  font-size:.72rem;color:var(--ink-soft);letter-spacing:.1em;
  border-bottom:1px solid var(--rule);padding-bottom:.15rem;margin-bottom:.35rem;
  display:flex;justify-content:space-between;align-items:baseline;
}
.body{font-size:.95rem;line-height:1.72;white-space:pre-wrap}
.en{font-size:.92rem;line-height:1.7}

/* ── 성구 토큰: 이 도구의 주인공 ── */
.cit{
  padding:0 .12em;border-bottom:2px solid transparent;
  font-variant-numeric:tabular-nums;white-space:nowrap;
}
.cit.ok{border-bottom-color:var(--rule)}
.cit.miss{border-bottom-color:var(--red);color:var(--red);font-weight:400}
.cit.diff{border-bottom-color:var(--blue);color:var(--blue)}
.cit.note{border-bottom-color:var(--ochre);color:var(--ochre)}

textarea{
  width:100%;min-height:9rem;padding:.55rem .65rem;
  border:1px solid var(--ink);background:var(--paper-lit);
  line-height:1.85;font-size:.98rem;resize:vertical;
}
textarea:focus{outline:2px solid var(--blue);outline-offset:-1px}
.acts{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.7rem;align-items:center}
.hint{font-size:.8rem;color:var(--ink-soft)}
.sugg{
  display:inline-flex;gap:.4rem;align-items:baseline;
  border:1px dashed var(--blue);color:var(--blue);background:none;
  padding:.22rem .6rem;font-size:.85rem;
}
.sugg:hover{background:var(--blue);color:var(--paper-lit)}
.empty{color:var(--ink-soft);padding:3rem 0;max-width:52ch}
.empty h3{font-weight:400;font-size:1.05rem;margin:0 0 .5rem;color:var(--ink)}

#drop{
  position:fixed;inset:0;background:rgba(230,233,236,.96);z-index:50;
  display:none;align-items:center;justify-content:center;text-align:center;
}
#drop.on{display:flex}
#drop div{border:2px dashed var(--ink);padding:3rem 4rem}
footer{
  flex:none;border-top:1px solid var(--rule);background:var(--paper-lit);
  padding:.32rem 1rem;font-size:.8rem;color:var(--ink-soft);
  display:flex;gap:1.5rem;flex-wrap:wrap;align-items:center;
}
kbd{
  border:1px solid var(--rule);border-bottom-width:2px;padding:0 .3em;
  font-family:inherit;font-size:.9em;
}
/* 칸 고르는 딱지 — 지명·인명DB는 영·한 짝이 여럿이라 */
.fldtabs{display:flex;gap:.25rem;margin-bottom:.4rem;flex-wrap:wrap}
.ftab{
  border:1px solid var(--rule);background:transparent;color:var(--ink-soft);
  padding:.1rem .5rem;font-size:.76rem;
}
.ftab.on{border-color:var(--ink);color:var(--ink);font-weight:600;background:var(--paper)}
.ftab:disabled{opacity:.35;cursor:default}
.cit.nobook{border-bottom-style:dotted;border-bottom-color:var(--blue)}
/* 훑어보기 번역 */
.tbtn{
  border:1px solid var(--blue);background:transparent;color:var(--blue);
  font-size:.72rem;padding:0 .4em;margin-right:.4rem;
}
.tbtn:hover{background:var(--blue);color:var(--paper-lit)}
#trbox{margin-top:.7rem;padding-top:.6rem;border-top:1px dashed var(--ochre)}
#trbox .trbody{
  font-size:.88rem;line-height:1.7;color:var(--ochre);
}
#trbox::before{content:'';}
#trbox:not(:empty)::before{
  content:'기계 번역 — 뜻만 짚어 보는 용도이며 파일에 들어가지 않습니다';
  display:block;font-size:.7rem;color:var(--ink-soft);margin-bottom:.35rem;
}
.mapset{font-size:.75rem;color:var(--ink-soft);display:flex;align-items:center;gap:.3rem}
.mapset input{
  border:1px solid var(--rule);background:var(--paper);padding:.15rem .35rem;
  font-size:.72rem;width:15rem;
}
#gitbox{position:fixed;inset:0;background:rgba(30,42,51,.45);z-index:60;display:none;
  align-items:center;justify-content:center}
#gitbox.on{display:flex}
#gitbox .sheet{background:var(--paper-lit);border:1px solid var(--ink);padding:1.2rem 1.4rem;
  width:min(30rem,92vw)}
#gitbox h3{margin:0 0 .3rem;font-size:1.05rem;font-weight:600}
#gitbox select,#gitbox input{width:100%;margin-top:.5rem;padding:.35rem .5rem;
  border:1px solid var(--ink);background:var(--paper);font-size:.9rem}
.sheetacts{display:flex;gap:.5rem;margin-top:.8rem}
@media (max-width:1200px){ #cmpcol{width:270px} }
@media (max-width:1000px){
  main{flex-direction:column}
  #rail,#listwrap{width:100%;max-height:150px;border-right:none;border-bottom:1px solid var(--rule)}
  #detail{flex-direction:column;overflow-y:auto}
  #cmpcol{width:100%;max-height:220px;border-right:none;border-bottom:1px solid var(--rule)}
}
@media (prefers-reduced-motion:no-preference){
  .row,.kind{transition:background .12s}
}
</style>
</head>
<body>
<header>
  <h1>교정 책상</h1>
  <span class="sub" id="loaded">파일을 열거나 창에 끌어다 놓으십시오</span>
  <span class="sp"></span>
  <button class="btn" id="open">파일 열기</button>
  <button class="btn" id="fromGit">깃허브에서 열기</button>
  <button class="btn" id="fillAll" disabled>참조 구절 모두 채우기</button>
  <button class="btn" id="fixBooks" disabled>책 이름 채우기</button>
  <button class="btn" id="wipeRef" disabled>참조 씻어 내기</button>
  <button class="btn" id="expJson" disabled>평문 내려받기</button>
  <button class="btn" id="expEnc" disabled>암호본 내려받기</button>
  <button class="btn" id="expCsv" disabled>소견표 내려받기</button>
  <input type="file" id="file" accept=".json" hidden>
  <label class="mapset">성경지도 <input id="mapbase" value="https://bible-writer.github.io/kjm-bible/map.html"></label>
</header>

<main>
  <nav id="rail"></nav>
  <div id="listwrap"><div id="list"></div></div>
  <section id="detail">
    <div id="cmpcol"></div>
    <div id="textcol">
    <div class="empty">
      <h3>사전 파일을 여십시오</h3>
      <p>easton_full.json 또는 smith_full.json을 열면 영문과 한글의 성구 인용을 맞대어 보고,
      성경에 없는 절과 그 밖의 흠을 찾아 목록으로 세웁니다.</p>
      <p>절 수는 개역개정 기준으로 담아 두었습니다. 성경 본문은 담지 않았습니다.</p>
    </div>
    </div>
  </section>
</main>

<footer>
  <span><kbd>j</kbd> <kbd>k</kbd> 다음·이전</span>
  <span><kbd>e</kbd> 한글 고치기</span>
  <span><kbd>d</kbd> 마친 것으로</span>
  <span id="stat"></span>
</footer>

<div id="drop"><div>여기에 놓으십시오</div></div>

<div id="gitbox">
  <div class="sheet">
    <h3>깃허브에서 바로 열기</h3>
    <p class="hint">암호본은 비밀번호를 넣으면 풀어서 엽니다. 사전 두 종은 평문이라 비워 두어도 됩니다.</p>
    <select id="gitpick"></select>
    <input id="gitpw" type="password" placeholder="비밀번호 (암호본일 때만)">
    <div class="sheetacts">
      <button class="btn red" id="gitgo">열기</button>
      <button class="btn" id="gitcancel">그만두기</button>
    </div>
    <p class="hint" id="gitmsg"></p>
  </div>
</div>

function normBook(raw){
  if(!raw) return null;
  let t=raw.replace(/\./g,'').replace(/\s+/g,' ').trim();
  const m=t.match(/^([1-3])\s*(.+)$/);
  let num='', rest=t;
  if(m){ num=m[1]; rest=m[2]; }
  if(num && NUMBERED[rest]) rest=NUMBERED[rest];
  let full=num? num+' '+rest : rest;
  full=ALT[full]||full;
  return E2K[full]? full : null;
}

const LENIENT_CH = {'요엘':ch=>ch===4, '에스더':ch=>ch>=10};
function lenient(book, ch){ const f=LENIENT_CH[book]; return f? f(ch) : false; }

function maxVerse(koBook, ch){ const a=VC[koBook]; return (a && ch>=1 && ch<=a.length)? a[ch-1] : null; }
function nChap(koBook){ const a=VC[koBook]; return a?a.length:0; }
function grade(koBook, ch, v){
  if(lenient(koBook,ch)) return 0;
  if(KJV_OK.has(koBook+' '+ch+':'+v)) return 0;
  const m=maxVerse(koBook,ch);
  if(m===null) return 2;
  if(v>=1 && v<=m) return 0;
  return (v>m && v<=m+3) ? 1 : 2;
}
function crossChapter(koBook, ch, tail){
  const m=String(tail).match(/^(\d+)\s*[-–]\s*(\d+)$/); if(!m) return false;
  const end=+m[2], mv=maxVerse(koBook,ch);
  return mv!==null && end>mv && end>ch && end<=nChap(koBook);

function joinable(gap){

    const m=String(tail).match(/^(.*?)\s*[,\-–]\s*\d+$/);
    if(m) return m[1];
  }
  if(after && after[0]===':'){

    if(m) return m[1];
  }

  const out=new Set();

/* 영문 인용과 한글 인용을 하나씩 짝짓는다.
   ① 절이 겹치는 것끼리 먼저 맞춘다 (옮겨짐)
   ② 남은 것끼리 같은 장 안에서 맞춘다 (어긋남)
   ③ 그래도 남은 영문은 빠짐, 남은 한글은 한글에만
   이렇게 해야 '영문 11:24·11:25,26 ↔ 한글 11:24' 에서
   11:24끼리 맞고 11:25,26이 빠짐으로 잡힌다. */
function pairUp(EC, KC){
  const usedK=new Set(), usedE=new Set(), rows=[];
  EC.forEach((c,ci)=>{
    const hit=KC.findIndex((k,ki)=>!usedK.has(ki)&&k.book===c.book&&k.ch===c.ch&&[...c.vs].some(v=>k.vs.has(v)));
    if(hit>=0){ usedK.add(hit); usedE.add(ci); rows.push({en:c, ko:KC[hit], state:'ok'}); }
  });
  EC.forEach((c,ci)=>{
    if(usedE.has(ci)) return;
    const near=KC.findIndex((k,ki)=>!usedK.has(ki)&&k.book===c.book&&k.ch===c.ch);
    if(near<0) return;
    usedK.add(near); usedE.add(ci);
    /* 영문 절이 개역개정 절 수를 조금 넘는 경우는 KJV 절 구분 차이이므로 맞은 것으로 본다
       (보기: 고린도후서 13:14 ↔ 개역개정 13:13) */
    const vers = [...c.vs].some(v=>grade(c.book,c.ch,v)===1);
    rows.push({en:c, ko:KC[near], state: vers?'ok':'bad'});
  });
  EC.forEach((c,ci)=>{ if(!usedE.has(ci)) rows.push({en:c, ko:null, state:'miss'}); });
  KC.forEach((k,ki)=>{ if(!usedK.has(ki)) rows.push({en:null, ko:k, state:'only'}); });
  rows.sort((a,b)=>((a.en?a.en.at:1e9)-(b.en?b.en.at:1e9)));
  return rows;
}

const KINDS=[
  {id:'en_bad',  name:'영문 — 없는 절',   tone:'red',  tag:'없는 절'},
  {id:'ko_bad',  name:'한글 — 없는 절',   tone:'red',  tag:'없는 절'},

/* ══════════ 검사 ══════════ */
function items(){ return DB && PROF ? (DB[PROF.arr]||[]) : []; }
function pairsOf(y){                 /* 영·한 짝이 있는 칸만 */
  return PROF.pairs.filter(p=>(y[p.en]||'').trim() && (y[p.ko]||'').trim());
}
function scan(){
  ROWS=[]; const seenId={}, seenT={};
  items().forEach(y=>{
    const id=y[PROF.idk], title=PROF.title(y)||'(이름 없음)';
    const push=(kind,note,ex)=>ROWS.push(Object.assign({id,term:title,kind,note},ex||{}));
    seenId[id]=(seenId[id]||0)+1; seenT[title]=(seenT[title]||0)+1;

    const over=c=>c.book+' '+c.ch+'장은 '+(maxVerse(c.book,c.ch)===null?'없음':maxVerse(c.book,c.ch)+'절까지');
    const seen=new Set(), key=c=>c.book+'|'+c.ch+'|'+[...c.vs].join(',');

    PROF.pairs.forEach(pr=>{
      const en=y[pr.en]||'', ko=y[pr.ko]||'';
      if(!en.trim()) return;
      const EC=enCites(en), KC=koCites(ko);
      const both=c=>KC.some(o=>!o.inferred&&key(o)===key(c))||EC.some(o=>!o.inferred&&key(o)===key(c));
      [[EC,'en'],[KC,'ko']].forEach(([L,side])=>L.forEach(c=>{
        if(c.inferred) return;
        const k=pr.label+'|'+key(c); if(seen.has(k)) return; seen.add(k);
        const g=worst(c), who=both(c)?'영문·한글':(side==='en'?'영문':'한글');
        if(g===2) push(side==='en'?'en_bad':'ko_bad', pr.label+' '+who+' '+c.raw+'  →  '+over(c),
                       side==='en'?{cit:c.raw,fld:pr}:{kocit:c.raw,fld:pr});
        else if(g===1) push('versify', pr.label+' '+who+' '+c.raw+
                       (crossChapter(c.book,c.ch,c.tail)?' — 장을 넘는 범위':' — KJV 절 구분 차이일 수 있음'),
                       side==='en'?{cit:c.raw,fld:pr}:{kocit:c.raw,fld:pr});
      }));
      if(!ko.trim()){ push('ko_none', pr.label+' — 영문 '+en.length+'자, 한글 없음', {fld:pr}); return; }
      /* 영문 인용이 한글에 옮겨졌는가 */
      const missList=[];
      pairUp(EC, KC).forEach(p2=>{
        if(!p2.en || p2.en.inferred) return;
        if(p2.state==='miss'){ missList.push(p2.en.raw); return; }
        if(p2.state==='bad')
          push('mismatch', pr.label+' 영문 '+p2.en.raw+'  ·  한글 '+p2.ko.raw,
               {cit:p2.en.raw, kocit:p2.ko.raw, fld:pr,
                want:p2.en.book+' '+p2.en.ch+':'+[...p2.en.vs].join(','), got:[p2.ko.raw]});
      });
      /* 한 항목·한 칸의 빠짐은 한 줄로 묶는다 */
      if(missList.length)
        push('en_miss', pr.label+' — 한글에 빠진 인용 '+missList.length+'건 · '+missList.slice(0,5).join(' · ')
             +(missList.length>5?' …':''), {cit:missList[0], kocit:null, fld:pr});
      /* 책 이름 없는 인용도 묶는다 */
      const nb=KC.filter(k=>k.inferred);
      if(nb.length)
        push('nobook', pr.label+' — 책 이름 없는 인용 '+nb.length+'건 · '
             +nb.slice(0,5).map(k=>k.raw+'→'+k.book).join(' · ')+(nb.length>5?' …':''),
             {kocit:nb[0].raw, fld:pr});
    });

    /* 한글만 있는 칸 */
    PROF.koOnly.forEach(f=>{
      const ko=y[f]||''; if(!ko.trim()) return;
      koCites(ko).forEach(c=>{ if(c.inferred) return;
        const g=worst(c);
        if(g===2) push('ko_bad', f+' '+c.raw+'  →  '+over(c), {kocit:c.raw, fld:{ko:f,label:f}});
        else if(g===1) push('versify', f+' '+c.raw+' — 절 구분 차이일 수 있음', {kocit:c.raw, fld:{ko:f,label:f}}); });
    });

    /* 짧은 꼴 성구 칸 (지명DB verse 등) */
    (PROF.verseAbbr||[]).forEach(f=>{
      const t=y[f]; if(!t || typeof t!=='string') return;
      abbrCites(t).forEach(c=>{ const g=worst(c);
        if(g===2) push('ref_bad', f+' '+c.raw+'  →  '+over(c), {fld:{ko:f,label:f}}); });
    });

    /* 절 목록 배열 (인명DB verses) */
    if(PROF.verseArr && Array.isArray(y[PROF.verseArr])){
      const bad=[];
      y[PROF.verseArr].forEach(v=>{
        const b=KOBOOK[(v.book|0)-1];
        if(!b || grade(b, v.chapter|0, v.verse|0)===2) bad.push((b||('책'+v.book))+' '+v.chapter+':'+v.verse);
      });
      if(bad.length) push('ref_bad', PROF.verseArr+' — 없는 절 '+bad.length+'건 · '+bad.slice(0,4).join(' · '));
    }

    /* 그 밖 */
    const allKo=[...PROF.pairs.map(p=>y[p.ko]), ...PROF.koOnly.map(f=>y[f])].filter(x=>typeof x==='string').join(' ');
    const o=(allKo.match(/\(/g)||[]).length, cc=(allKo.match(/\)/g)||[]).length;
    if(o!==cc) push('paren','여는 괄호 '+o+' · 닫는 괄호 '+cc);
    if(/[\u4e00-\u9fff]/.test(allKo+' '+title)) push('hanja','한자가 들어 있음');
    PROF.codes.forEach(f=>String(y[f]||'').split(',').forEach(c=>{
      c=c.trim(); if(c && !/^[HG]\d{4}$/.test(c)) push('strong', f+' "'+c+'" 는 H0000·G0000 꼴이 아님'); }));
    /* ustrong 같은 TIPNR 코드는 뒤에 글자가 붙는 것이 정상이므로 느슨히 본다 */
    (PROF.loose||[]).forEach(f=>String(y[f]||'').split(',').forEach(c=>{
      c=c.trim(); if(c && !/^[HG]\d{4}[A-Za-z]?$/.test(c)) push('strong', f+' "'+c+'" 는 H0000·G0000 꼴이 아님'); }));
  });
  items().forEach(y=>{
    const id=y[PROF.idk], t=PROF.title(y)||'(이름 없음)';
    if(seenId[id]>1)  ROWS.push({id,term:t,kind:'dupid',note:'같은 id가 '+seenId[id]+'개'});
    if(PROF.dupTitle && seenT[t]>1) ROWS.push({id,term:t,kind:'duptitle',note:'같은 표제어가 '+seenT[t]+'개'});
  });
  ROWS=ROWS.filter((r,i,a)=>a.findIndex(x=>x.id===r.id&&x.kind===r.kind&&x.note===r.note)===i);
  ROWS.forEach((r,i)=>{r.key=i; r.done=false;});
}

/* ══════════ 그리기 ══════════ */
const $=s=>document.querySelector(s);
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function bookId(ko){ const i=KOBOOK.indexOf(ko); return i<0?null:i+1; }
function mapUrl(c){
  const b=bookId(c.book); if(!b) return null;
  const v=[...c.vs][0]||1;
  return MAPBASE + (MAPBASE.indexOf('?')<0?'?':'&') + 'goto=' + b + '.' + c.ch + '.' + v;
}
function markEn(t, focus, pick){
  if(!t) return '';
  let out='', last=0;
  enCites(t).forEach(c=>{
    out+=esc(t.slice(last,c.at));
    const g=c.inferred?0:worst(c);
    let cls=g===2?'miss':g===1?'note':(focus&&c.raw===focus?'diff':'ok');
    if(pick&&c.raw===pick) cls+=' pick';
    const u=mapUrl(c);
    out+=(u?'<a class="cit '+cls+'" href="'+u+'" target="_blank" rel="noopener">':'<span class="cit '+cls+'">')
       + esc(t.substr(c.at,c.len)) + (u?'</a>':'</span>');
    last=c.at+c.len;
  });
  return out+esc(t.slice(last));
}
function markKoPlain(t, focus, pick){
  if(!t) return '';
  let out='', last=0;
  koCites(t).forEach(c=>{
    out+=esc(t.slice(last,c.at));
    const g=c.inferred?0:worst(c);
    let cls=g===2?'miss':(g===1||lenient(c.book,c.ch))?'note':(focus&&focus.some(f=>f===c.raw)?'diff':'ok');
    if(c.inferred) cls+=' nobook';
    if(pick&&c.raw===pick) cls+=' pick';
    const u=mapUrl(c);
    out+=(u?'<a class="cit '+cls+'" href="'+u+'" target="_blank" rel="noopener">':'<span class="cit '+cls+'">')
       + esc(t.substr(c.at,c.len)) + (u?'</a>':'</span>');
    last=c.at+c.len;
  });
  return out+esc(t.slice(last));
}
function markKo(t, focus, pick){
  if(!t) return '';
  const rm=t.match(/\s*\(\s*참조\s*:[^()]*\)+\s*$/);
  if(!rm) return markKoPlain(t,focus,pick);
  return markKoPlain(t.slice(0,rm.index),focus,pick)
       + '<span class="refmark">'+markKoPlain(rm[0],focus,pick)+'</span>';
}
/* ── 영문 훑어보기 번역 (MyMemory) ──
   파일에 넣지 않고 화면에만 보인다. 500자 제한이 있어 문장 단위로 잘라 보낸다. */
const TRC={};                       /* 한 번 옮긴 것은 기억해 둔다 */
function splitForTranslate(t, lim){
  lim=lim||430; const out=[]; let cur='';
  String(t).replace(/\s+/g,' ').trim().split(/(?<=[.!?;])\s+/).forEach(sn=>{
    if((cur+' '+sn).trim().length>lim){ if(cur) out.push(cur.trim()); 
      while(sn.length>lim){ out.push(sn.slice(0,lim)); sn=sn.slice(lim); }
      cur=sn; }
    else cur=(cur+' '+sn).trim();
  });
  if(cur) out.push(cur);
  return out;
}
async function translateEn(txt, box){
  const key=txt.length+'|'+txt.slice(0,60);
  if(TRC[key]){ box.innerHTML='<div class="trbody">'+esc(TRC[key])+'</div>'; return; }
  const parts=splitForTranslate(txt), got=[];
  for(let i=0;i<parts.length;i++){
    box.innerHTML='<p class="hint">옮기는 중… '+(i+1)+' / '+parts.length+'</p>';
    try{
      const r=await fetch('https://api.mymemory.translated.net/get?langpair=en|ko&q='+encodeURIComponent(parts[i]));
      const j=await r.json();
      const v=j && j.responseData && j.responseData.translatedText;
      got.push(v && !/MYMEMORY WARNING|QUERY LENGTH/i.test(v) ? v : '(이 대목은 옮기지 못했습니다)');
    }catch(e){ got.push('(이 대목은 옮기지 못했습니다)'); }
  }
  const all=got.join(' ');
  const failed=got.filter(x=>x.indexOf('옮기지 못했습니다')>=0).length;
  TRC[key]=all;
  box.innerHTML='<div class="trbody">'+esc(all)+'</div>'
    + (failed? '<p class="hint">'+failed+'토막을 옮기지 못했습니다. 📋 복사로 영문을 떠서 다른 번역기에 붙여 보십시오.</p>':'');
}

/* 영문 기준 대조 */
function cmpRows(y, fld){ return pairUp(enCites(y[fld.en]||''), koCites(y[fld.ko]||'')); }
function missingRefs(y, fld){
  const out=[], seen=new Set();
  cmpRows(y,fld).forEach(p=>{
    if(p.state!=='miss'||!p.en||p.en.inferred) return;
    if(!KOBOOK.includes(p.en.book)) return;          /* 한글 책 이름이 아니면 넣지 않는다 */
    const t=p.en.book+' '+p.en.ch+':'+String(p.en.tail).replace(/\s+/g,'');
    if(!seen.has(t)){ seen.add(t); out.push(t); }
  });
  return out;
}
/* 이미 붙은 참조를 남김없이 떼어 낸다.
   옛 판이 겹쳐 붙이며 "(참조: …)) (참조: …)" 처럼 괄호가 어긋난 것도 씻는다. */
const REF_ALL=/\s*\(\s*참조\s*:[^()]*\)*\s*$/;
function stripRefs(v){
  let t=String(v||'');
  for(let i=0;i<8;i++){
    const n=t.replace(REF_ALL,'').replace(/\s*\)+\s*$/, m=>{
      /* 참조를 떼고 남은 짝 없는 닫는 괄호만 지운다 */
      const head=t.slice(0,t.length-m.length);
      return (head.split('(').length-1) > (head.split(')').length-1) ? m : '';
    });
    if(n===t) break; t=n;
  }
  return t.replace(/\s+$/,'');
}
/* 책 이름이 빠진 한글 인용에 이름을 넣는다.
   영문의 같은 장:절 인용이 오직 하나의 책을 가리키고 그 책이 한글이 이어받은 책과
   같을 때만 '확실'로 보아 채운다. 다른 책이 섞이면 손대지 않는다. */
function bookFixes(y, fld){
  const EC=enCites(y[fld.en]||''), KC=koCites(y[fld.ko]||'');
  const sure=[], doubt=[];
  KC.forEach(k=>{
    if(!k.inferred) return;
    const cand=EC.filter(c=>c.ch===k.ch && [...c.vs].some(v=>k.vs.has(v)));
    const books=[...new Set(cand.map(c=>c.book))];
    if(books.length===1 && books[0]===k.book) sure.push({at:k.at, len:k.len, raw:k.raw, to:k.book+' '+k.raw});
    else doubt.push({raw:k.raw, book:k.book, en:books});
  });
  return {sure, doubt};
}
function applyBookFixes(y, fld){
  const {sure}=bookFixes(y,fld);
  if(!sure.length) return 0;
  let t=String(y[fld.ko]||'');
  sure.slice().sort((a,b)=>b.at-a.at).forEach(f=>{      /* 뒤에서부터 넣어야 자리가 안 밀린다 */
    t = t.slice(0,f.at) + f.to + t.slice(f.at+f.len);
  });
  y[fld.ko]=t; y.__touched=true; return sure.length;
}
function refLine(v){
  const t=String(v||''); const m=t.match(/\(\s*참조\s*:\s*([^()]*)\)/g);
  if(!m) return '';
  return m.map(x=>x.replace(/^\(\s*참조\s*:\s*/,'').replace(/\)$/,'').trim())
          .join('; ').split(/\s*;\s*/).filter((v,i,a)=>v&&a.indexOf(v)===i).join('; ');
}
function balanced(t){ return (String(t).split('(').length) === (String(t).split(')').length); }
function setRefs(y, fld, text){
  const cur=stripRefs(y[fld.ko]);
  const list=String(text).split(/\s*;\s*/).map(x=>x.trim()).filter((v,i,a)=>v&&a.indexOf(v)===i);
  const next = list.length ? cur+' (참조: '+list.join('; ')+')' : cur;
  if(!balanced(next)){ alert('괄호가 맞지 않아 넣지 않았습니다. 한글 본문을 먼저 살펴보십시오.'); return false; }
  y[fld.ko]=next; y.__touched=true; return true;
}
function counts(){ const c={}; ROWS.forEach(r=>{ if(!r.done) c[r.kind]=(c[r.kind]||0)+1; }); return c; }
function drawRail(){

  h+='</div><div class="railsec"><h2>마친 것</h2>'

   +'<div class="railsec"><h2>표시</h2><p class="hint" style="margin:0">'

   +'<span class="cit diff">푸른 밑줄</span> 지금 보는 인용<br>'
   +'<span class="cit note">누런 밑줄</span> 넘어가도 되는 것<br>'
   +'<span class="cit nobook">점선</span> 책 이름 없는 인용<br>'
   +'<span style="color:var(--green)">초록</span> 손댄 자리<br>'
   +'<span class="hint">성구를 누르면 성경지도가 열립니다</span></p></div>';
  $('#rail').innerHTML=h;
  $('#rail').querySelectorAll('.kind').forEach(b=>b.onclick=()=>{KIND=b.dataset.k;CUR=null;CURID=null;SHOW=250;draw();});

const TONE={red:0,note:1,blue:2};
/* '모두'에서는 빼 두고, 왼쪽에서 그 갈래를 눌러야 보이는 것들 */
const QUIET=new Set(['nobook','ko_none']);
function visible(){
  if(KIND==='done') return ROWS.filter(r=>r.done);
  const v=ROWS.filter(r=>!r.done&&(KIND==='all'?!QUIET.has(r.kind):r.kind===KIND));
  if(KIND!=='all') return v;
  const t=r=>{const k=KINDS.find(x=>x.id===r.kind); return TONE[k?k.tone:'blue'];};
  return v.slice().sort((a,b)=>t(a)-t(b)||a.id-b.id);
}
function drawList(){
  const all=visible(), v=all.slice(0,SHOW);
  $('#list').innerHTML = all.length ? v.map(r=>{
    const k=KINDS.find(x=>x.id===r.kind)||{tone:'blue',tag:r.kind};
    const y=items().find(e=>e[PROF.idk]===r.id);
    return `<button class="row t-${k.tone} ${r.done?'done':''}${y&&y.__touched?' touched':''}" data-key="${r.key}" aria-current="${CUR===r.key}">
      <span class="rbadge">${esc(k.tag)}</span><span class="rid">${r.id}</span>
      <div class="rterm">${esc(r.term)}</div><div class="rnote">${esc(r.note)}</div></button>`;}).join('')
    + (all.length>SHOW?`<button class="row" id="more" style="text-align:center;color:var(--blue)">아래로 더 보기 <span class="rid">(${SHOW} / ${all.length})</span></button>`:'')
    : '<p class="hint" style="padding:1.2rem">이 갈래에는 남은 것이 없습니다.</p>';
  $('#list').querySelectorAll('.row').forEach(b=>{
    if(b.id==='more'){ b.onclick=()=>{SHOW+=250;drawList();}; return; }
    b.onclick=()=>{CUR=+b.dataset.key; CURID=ROWS.find(x=>x.key===CUR).id; EDIT=false; PICK=null; PICKKO=null; draw();};
  });

}
function drawDetail(){
  const d=$('#textcol'), cc=$('#cmpcol');
  let r = CUR!==null ? ROWS.find(x=>x.key===CUR) : null;
  if(!r && CURID!==null) r={id:CURID, term:'', kind:'clear', note:''};
  if(!r){ cc.innerHTML=''; d.innerHTML='<div class="empty"><h3>왼쪽에서 하나를 고르십시오</h3><p>성구 대조표가 왼쪽에, 본문이 여기에 나옵니다.</p></div>'; return; }
  const y=items().find(e=>e[PROF.idk]===r.id);
  if(!y){ cc.innerHTML=''; d.innerHTML=''; return; }
  const kind=KINDS.find(k=>k.id===r.kind)||{name:'남은 소견 없음',tone:'ok'};
  const col=kind.tone==='red'?'var(--red)':kind.tone==='note'?'var(--ochre)':kind.tone==='ok'?'var(--green)':'var(--blue)';
  const fld = r.fld && r.fld.en ? PROF.pairs.find(p=>p.label===r.fld.label) : (pairsOf(y)[0]||PROF.pairs[0]||null);

  /* 대조표 */
  if(fld && fld.en){
    const P=cmpRows(y,fld), n={ok:0,bad:0,miss:0,only:0}; P.forEach(p=>n[p.state]++);
    let ch=`<div class="fldtabs">${PROF.pairs.map(p=>
      `<button class="ftab${p.label===fld.label?' on':''}" data-f="${esc(p.label)}"${(y[p.en]||'').trim()?'':' disabled'}>${esc(p.label)}</button>`).join('')}</div>`;
    ch+=`<table class="cmp"><caption>영문 ${n.ok+n.bad+n.miss}건 ·
      <span style="color:var(--green)">옮겨짐 ${n.ok}</span> ·
      <span style="color:var(--red)">빠짐 ${n.miss}</span> ·
      <span style="color:var(--red)">어긋남 ${n.bad}</span>${n.only?' · 한글에만 '+n.only:''}</caption>
      <thead><tr><th>영문</th><th>한글</th><th class="mk">일치</th></tr></thead><tbody>`;
    P.forEach(p=>{
      const mk=p.state==='ok'?'✓':p.state==='only'?'＋':'✗';
      const on=(PICK&&p.en&&p.en.raw===PICK)?' on':'';
      ch+=`<tr class="${p.state}${on}" data-en="${esc(p.en?p.en.raw:'')}" data-ko="${esc(p.ko?p.ko.raw:'')}">
        <td>${p.en?esc(p.en.raw):'<span class="none">영문에 없음</span>'}</td>
        <td>${p.ko?esc(p.ko.raw):'<span class="none">한글에 없음</span>'}</td>
        <td class="mk">${mk}</td></tr>`;
    });
    cc.innerHTML=ch+'</tbody></table>';
  } else {
    cc.innerHTML='<p class="hint">이 파일에는 영문 원문이 없어 대조표를 만들 수 없습니다.</p>';
  }

  /* 본문 */
  const metas=(PROF.meta(y)||[]).filter(Boolean).map(esc).join(' · ');
  let h=`<div class="entryhead${y.__touched?' touched':''}" style="border-bottom-color:${y.__touched?'var(--green)':col}">
    <p class="t">${esc(PROF.title(y))}${y.__touched?'<span class="tag-touched">고침</span>':''}</p>
    <p class="m">id ${y[PROF.idk]}${metas?' · '+metas:''} · <span style="color:${col};font-weight:600">${esc(kind.name)}</span></p></div>`;
  const komate = PICK ? PICKKO : r.kocit;
  h+='<div id="twocol">';
  if(fld && fld.en){
    h+=`<div class="pane"><div class="lab">
        <span>${esc(fld.label)} 영문 — 고치지 않음</span>
        <span><button class="tbtn" id="trgo">🌐 뜻 보기</button><button class="tbtn" id="trcopy">📋 복사</button> ${(y[fld.en]||'').length}자</span></div>
      <div class="scroll"><div class="body en">${markEn(y[fld.en], PICK||r.cit, PICK||null)}</div>
      <div id="trbox"></div></div></div>`;
  }
  const kof = fld ? (fld.ko||fld) : (PROF.koOnly[0]||null);
  const kotxt = kof ? (y[kof.ko||kof]||'') : '';
  const kokey = kof ? (kof.ko||kof) : null;
  h+=`<div class="pane"><div class="lab"><span>${esc(fld?fld.label:(kokey||''))} 한글${y.__touched?' <span class="edited">· 고침</span>':''}</span><span>${kotxt.length}자</span></div>`;
  if(EDIT){
    h+=`<textarea id="ta">${esc(kotxt)}</textarea>
        <div class="acts"><button class="btn red" id="save">고친 것 넣기</button><button class="btn" id="cancel">그만두기</button></div>`;
  } else {
    const miss = fld&&fld.en ? missingRefs(y,fld) : [];
    const have = kokey ? refLine(y[kokey]) : '';
    const notIn = miss.filter(t=>have.indexOf(t)<0);
    h+=`<div class="scroll"><div class="body">${markKo(kotxt, komate?[komate]:r.got, komate)}</div>`;
    if(fld && fld.en){
      h+=`<div class="refbox${have?' filled':''}">
        <div class="reflab">${have?'참조 구절 — 넣었습니다':'참조 구절 — 영문에만 있는 성구를 한글 끝에 붙입니다'}</div>
        <input id="refin" value="${esc(have)}" placeholder="예) 사무엘상 6:18; 열왕기상 1:19">
        <div class="refacts">${notIn.length?`<button class="sugg" id="reffill">영문에만 있는 ${notIn.length}건 채우기</button>`:''}
          <button class="btn" id="refsave">참조 넣기</button>${have?'<button class="btn" id="refclear">참조 씻어 내기</button>':''}</div>
        <div class="refhint">${miss.length?miss.map(esc).join(' · '):'영문에만 있는 성구가 없습니다.'}</div></div>`;
    }
    h+='</div><div class="acts"><button class="btn" id="edit">한글 고치기</button>';
    if(r.kind==='mismatch'&&r.want&&r.kocit&&kotxt.indexOf(r.kocit)>=0)
      h+=`<button class="sugg" id="apply">한글의 ${esc(r.kocit)} 를 ${esc(r.want)} 로</button>`;
    if(r.kind==='nobook'&&fld&&fld.en){
      const bf=bookFixes(y,fld);
      if(bf.sure.length) h+=`<button class="sugg" id="bookfix">확실한 ${bf.sure.length}건에 책 이름 넣기</button>`;
      if(bf.doubt.length) h+=`<span class="hint" style="color:var(--red)">손으로 볼 것 ${bf.doubt.length}건 — ${esc(bf.doubt.slice(0,3).map(x=>x.raw+'(한글 '+x.book+' / 영문 '+(x.en.join('·')||'짝없음')+')').join(' · '))}</span>`;
    }
    h+=`<button class="btn" id="done">${r.done?'다시 열기':'판정 끝'}</button></div>`;
  }
  d.innerHTML=h+'</div></div>';

  cc.querySelectorAll('.ftab').forEach(b=>b.onclick=()=>{
    const p=PROF.pairs.find(x=>x.label===b.dataset.f);
    if(!p) return; r.fld=p; PICK=null; PICKKO=null; drawDetail(); });
  cc.querySelectorAll('.cmp tbody tr').forEach(tr=>tr.onclick=()=>{
    const k=tr.dataset.en||tr.dataset.ko;
    PICK=(PICK===k)?null:k; PICKKO=tr.dataset.ko||null; drawDetail();
    d.querySelectorAll('#twocol .cit.pick').forEach(el=>el.scrollIntoView&&el.scrollIntoView({block:'center'}));
  });
  const on=(id,fn)=>{const el=$('#'+id); if(el) el.onclick=fn;};
  on('trgo',()=>{
    const box=$('#trbox'); const b=$('#trgo');
    if(box.dataset.on==='1'){ box.innerHTML=''; box.dataset.on=''; b.textContent='🌐 뜻 보기'; return; }
    box.dataset.on='1'; b.textContent='🌐 닫기';
    translateEn(y[fld.en]||'', box);
  });
  on('trcopy',()=>{
    const t=(y[fld.en]||'');
    const say=ok=>{ const b=$('#trcopy'); b.textContent=ok?'📋 복사됨':'📋 안 됨';
      setTimeout(()=>{const c=$('#trcopy'); if(c) c.textContent='📋 복사';},1600); };
    if(navigator.clipboard&&navigator.clipboard.writeText)
      navigator.clipboard.writeText(t).then(()=>say(1),()=>say(0));
    else { const ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta);
      ta.select(); try{document.execCommand('copy');say(1);}catch(e){say(0);} ta.remove(); }
  });
  on('reffill',()=>{ const i=$('#refin'), have=i.value.trim();
    const add=missingRefs(y,fld).filter(t=>have.indexOf(t)<0);
    i.value=have?have+'; '+add.join('; '):add.join('; '); i.focus(); });
  on('refsave',()=>{ if(setRefs(y,fld,$('#refin').value)) rescan(); });
  on('refclear',()=>{ y[fld.ko]=stripRefs(y[fld.ko]); y.__touched=true; rescan(); });
  on('edit',()=>{EDIT=true;drawDetail();setTimeout(()=>{const t=$('#ta'); if(t)t.focus();},0);});
  on('cancel',()=>{EDIT=false;drawDetail();});
  on('save',()=>{ if(kokey){ y[kokey]=$('#ta').value; y.__touched=true; } EDIT=false; rescan(); });
  on('bookfix',()=>{ const n=applyBookFixes(y,fld); if(n) rescan(); else alert('확실한 것이 없습니다.'); });
  on('apply',()=>{ if(kokey){ y[kokey]=String(y[kokey]).replace(r.kocit, r.want); y.__touched=true; } rescan(); });
  on('done',()=>{ r.done=!r.done; draw(); });
}
function rescan(){
  const keep=CURID, doneSet=new Set(ROWS.filter(r=>r.done).map(r=>r.id+'|'+r.kind+'|'+r.note));
  scan(); ROWS.forEach(r=>{ if(doneSet.has(r.id+'|'+r.kind+'|'+r.note)) r.done=true; });
  const same=ROWS.find(r=>r.id===keep&&!r.done); CUR=same?same.key:null; draw();
}
function draw(){ drawRail(); drawList(); drawDetail(); drawStat(); }
function drawStat(){
  const t=DB?items().filter(e=>e.__touched).length:0;
  $('#stat').textContent = DB? `소견 ${ROWS.filter(r=>!r.done).length} 남음 · 고친 항목 ${t}` : '';
  ['expJson','expEnc','expCsv'].forEach(i=>$('#'+i).disabled=!DB);
  const dirty=DB?items().filter(y=>PROF.pairs.some(f=>/\(\s*참조\s*:/.test(String(y[f.ko]||'')))).length:0;
  const nb=DB?[...new Set(ROWS.filter(r=>r.kind==='nobook'&&!r.done).map(r=>r.id))].length:0;
  const bb=$('#fixBooks'); bb.disabled=!nb;
  bb.textContent = nb?`책 이름 ${nb}항목 채우기`:'책 이름 채우기';
  const wb=$('#wipeRef'); wb.disabled=!dirty;
  wb.textContent = dirty?`참조 ${dirty}항목 씻어 내기`:'참조 씻어 내기';
  const miss=DB?[...new Set(ROWS.filter(r=>r.kind==='en_miss'&&!r.done).map(r=>r.id))].length:0;
  const fb=$('#fillAll'); fb.disabled=!miss;
  fb.textContent = miss?`참조 ${miss}항목 채우기`:'참조 채우기';
}

/* ══════════ 파일 읽기 ══════════ */
function load(text, name){
  let j; try{ j=JSON.parse(text); }catch(e){ alert('JSON을 읽지 못했습니다. '+e.message); return; }
  const p=detect(j);
  if(!p){ alert('아는 얼개가 아닙니다. 사전(entries) · 지명(places) · 인명(persons) · 용어(terms) 가운데 하나여야 합니다.'); return; }
  DB=j; PROF=p; FILE=name;
  $('#loaded').textContent = `${p.name} · ${name} · v${j.version||'?'} · ${(j[p.arr]||[]).length.toLocaleString()}항목`;
  scan(); KIND='all'; CUR=null; CURID=null; SHOW=250; PICK=null; PICKKO=null; draw();
}
$('#open').onclick=()=>$('#file').click();
$('#file').onchange=e=>{const f=e.target.files[0]; if(f) f.text().then(t=>load(t,f.name)); };
const drop=$('#drop');
['dragenter','dragover'].forEach(ev=>document.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('on');}));
['dragleave','drop'].forEach(ev=>document.addEventListener(ev,e=>{
  e.preventDefault();
  if(ev==='dragleave'&&e.relatedTarget) return;
  drop.classList.remove('on');
  if(ev==='drop'){ const f=e.dataTransfer.files[0]; if(f) f.text().then(t=>load(t,f.name)); }
}));

/* ══════════ 깃허브에서 바로 읽기 (암호본이면 풀어서) ══════════ */
const RAW='https://raw.githubusercontent.com/bible-writer/kjm-bible/HEAD/';
const FILES=[['easton_full.json','이스턴 사전'],['smith_full.json','스미스 사전'],
             ['placeDatabase.json','지명DB'],['personDatabase.json','인명DB'],['termDatabase.json','용어DB']];
function b64(s){ const b=atob(s), a=new Uint8Array(b.length); for(let i=0;i<b.length;i++) a[i]=b.charCodeAt(i); return a; }
async function decrypt(z, pw){
  const enc=new TextEncoder();
  const base=await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key=await crypto.subtle.deriveKey(
    {name:'PBKDF2', salt:b64(z.salt), iterations:z.iterations||200000, hash:'SHA-256'},
    base, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const out=await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(z.iv)}, key, b64(z.ciphertext));
  return new TextDecoder().decode(out);
}
$('#fromGit').onclick=()=>{
  const sel=$('#gitpick');
  sel.innerHTML=FILES.map(f=>`<option value="${f[0]}">${f[1]}</option>`).join('');
  $('#gitbox').classList.add('on'); $('#gitpw').focus();
};
$('#gitcancel').onclick=()=>$('#gitbox').classList.remove('on');
$('#gitgo').onclick=async ()=>{
  const f=$('#gitpick').value, pw=$('#gitpw').value;
  const msg=$('#gitmsg'); msg.textContent='내려받는 중…';
  try{
    const res=await fetch(RAW+f, {cache:'no-store'});
    if(!res.ok) throw new Error('내려받지 못했습니다 ('+res.status+')');
    let text=await res.text();
    const j=JSON.parse(text);
    if(j.encrypted){
      if(!pw){ msg.textContent='이 파일은 암호본입니다. 비밀번호를 넣으십시오.'; return; }
      msg.textContent='푸는 중…';
      text=await decrypt(j, pw);
    }
    $('#gitbox').classList.remove('on'); msg.textContent='';
    load(text, f);
  }catch(e){ msg.textContent='읽지 못했습니다 — '+e.message; }
};

/* ══════════ 내보내기 ══════════ */
function dl(name, text, type){
  const b=new Blob([text],{type:type||'application/json'}), u=URL.createObjectURL(b);
  const a=document.createElement('a'); a.href=u; a.download=name; a.click();
  setTimeout(()=>URL.revokeObjectURL(u),1000);
}
function bumped(){
  const n=items().filter(e=>e.__touched).length;
  const v=String(DB.version||'0.0.0').split('.');
  v[v.length-1]=(+v[v.length-1]+1)||1; DB.version=v.join('.');
  DB.date=new Date().toISOString().slice(0,10);
  DB.note=(DB.note||'')+` | ${DB.date}: 교정 책상에서 ${n}항목 수정.`;
  return {n, out:JSON.parse(JSON.stringify(DB,(k,val)=>k==='__touched'?undefined:val))};
}
$('#expJson').onclick=()=>{
  const n=items().filter(e=>e.__touched).length;
  if(!n && !confirm('고친 항목이 없습니다. 그래도 내려받으시겠습니까?')) return;
  const {out}=bumped();
  dl(FILE.replace(/\.json$/,'')+'_v'+DB.version+'.json', JSON.stringify(out,null,1));
  drawStat();
};
$('#expEnc').onclick=async ()=>{
  const pw=prompt('암호본으로 만들 비밀번호를 넣으십시오.');
  if(!pw) return;
  const {out}=bumped();
  const plain=new TextEncoder().encode(JSON.stringify(out,null,1));
  const salt=crypto.getRandomValues(new Uint8Array(16)), iv=crypto.getRandomValues(new Uint8Array(12));
  const base=await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:200000,hash:'SHA-256'},
    base, {name:'AES-GCM',length:256}, false, ['encrypt']);
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv}, key, plain);
  const B=a=>btoa(String.fromCharCode(...new Uint8Array(a)));
  dl(FILE.replace(/\.json$/,'')+'_v'+DB.version+'_encrypted.json',
     JSON.stringify({encrypted:true,algo:'AES-GCM-256',kdf:'PBKDF2-SHA256',iterations:200000,
       salt:B(salt), iv:B(iv), ciphertext:B(ct)}));
  drawStat();
};
$('#expCsv').onclick=()=>{
  const q=s=>'"'+String(s==null?'':s).replace(/"/g,'""')+'"';
  const lines=[['id','표제어','갈래','소견','판정끝','고침'].map(q).join(',')].concat(ROWS.map(r=>{
    const y=items().find(e=>e[PROF.idk]===r.id);
    return [r.id,r.term,(KINDS.find(k=>k.id===r.kind)||{}).name||r.kind,r.note,r.done?'끝':'',y&&y.__touched?'고침':''].map(q).join(',');
  }));
  dl(FILE.replace(/\.json$/,'')+'_소견표.csv','\uFEFF'+lines.join('\r\n'),'text/csv');
};
$('#fillAll').onclick=()=>{
  const ids=[...new Set(ROWS.filter(r=>r.kind==='en_miss'&&!r.done).map(r=>r.id))];
  if(!ids.length){ alert('채울 것이 없습니다.'); return; }
  if(!confirm(ids.length+'개 항목의 한글 끝에 참조 구절을 붙입니다. 이어서 하시겠습니까?')) return;
  let n=0;
  ids.forEach(id=>{
    const y=items().find(e=>e[PROF.idk]===id); if(!y) return;
    PROF.pairs.forEach(fld=>{
      if(!(y[fld.en]||'').trim()||!(y[fld.ko]||'').trim()) return;
      const miss=missingRefs(y,fld); if(!miss.length) return;
      const have=refLine(y[fld.ko]);
      const add=miss.filter(x=>have.indexOf(x)<0); if(!add.length) return;
      if(setRefs(y,fld, have?have+'; '+add.join('; '):add.join('; '))) n++;
    });
  });
  rescan(); alert(n+'곳에 참조 구절을 붙였습니다.');
};

$('#fixBooks').onclick=()=>{
  const ids=[...new Set(ROWS.filter(r=>r.kind==='nobook'&&!r.done).map(r=>r.id))];
  if(!ids.length){ alert('채울 것이 없습니다.'); return; }
  let sure=0, doubt=0;
  ids.forEach(id=>{ const y=items().find(e=>e[PROF.idk]===id); if(!y) return;
    PROF.pairs.forEach(f=>{ if(!(y[f.en]||'').trim()||!(y[f.ko]||'').trim()) return;
      const bf=bookFixes(y,f); sure+=bf.sure.length; doubt+=bf.doubt.length; }); });
  if(!confirm(`확실한 ${sure}건에 책 이름을 넣습니다.\n영문 쪽 책이 다르거나 짝이 없는 ${doubt}건은 그대로 두어 손으로 보시게 남깁니다.\n\n이어서 하시겠습니까?`)) return;
  let n=0, e=0;
  ids.forEach(id=>{ const y=items().find(e2=>e2[PROF.idk]===id); if(!y) return;
    let m=0; PROF.pairs.forEach(f=>{ if(!(y[f.en]||'').trim()||!(y[f.ko]||'').trim()) return; m+=applyBookFixes(y,f); });
    if(m){ n+=m; e++; } });
  rescan(); alert(`${e}개 항목 ${n}건에 책 이름을 넣었습니다.\n남은 ${doubt}건은 왼쪽 '책 이름 없는 인용'에서 손으로 보십시오.`);
};
$('#wipeRef').onclick=()=>{
  const hit=items().filter(y=>PROF.pairs.some(f=>/\(\s*참조\s*:/.test(String(y[f.ko]||''))));
  if(!hit.length){ alert('붙은 참조가 없습니다.'); return; }
  if(!confirm(hit.length+'개 항목에 붙은 참조 구절을 모두 떼어 냅니다. 이어서 하시겠습니까?')) return;
  hit.forEach(y=>PROF.pairs.forEach(f=>{
    if(/\(\s*참조\s*:/.test(String(y[f.ko]||''))){ y[f.ko]=stripRefs(y[f.ko]); y.__touched=true; }
  }));
  rescan(); alert(hit.length+'개 항목에서 참조를 떼어 냈습니다.');
};

/* ══════════ 자판 ══════════ */
document.addEventListener('keydown',e=>{
  if(!DB||/^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
  const v=visible(); if(!v.length) return;
  const i=v.findIndex(r=>r.key===CUR);
  const go=k=>{CUR=k; CURID=ROWS.find(x=>x.key===k).id; EDIT=false; PICK=null; PICKKO=null; draw();};
  if(e.key==='j'){ if(i>=SHOW-1) SHOW+=250; go(v[Math.min(Math.max(i+1,0),v.length-1)].key); }
  if(e.key==='k'){ go(v[Math.max(i-1,0)].key); }
  if(e.key==='e'&&CUR!==null){ EDIT=true; drawDetail(); setTimeout(()=>{const t=$('#ta'); if(t)t.focus();},0); }
  if(e.key==='d'&&CUR!==null){ const r=ROWS.find(x=>x.key===CUR); r.done=!r.done; draw(); }
});
/* 주소로 넘어온 파일 열기: ?open=easton_full.json */
(function(){
  const q=new URLSearchParams(location.search);
  if(q.get('map')) { MAPBASE=q.get('map'); $('#mapbase').value=MAPBASE; }
  if(q.get('open')) setTimeout(()=>{ $('#fromGit').click(); $('#gitpick').value=q.get('open'); },100);
})();
$('#mapbase').onchange=e=>{ MAPBASE=e.target.value.trim()||MAPBASE; if(CUR!==null||CURID!==null) drawDetail(); };
</script>
